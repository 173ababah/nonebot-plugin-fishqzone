[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "nonebot-plugin-fishqzone"
version = "0.1.0"
description = "用协议端 cookies 发 QQ 空间说说（默认演练模式）"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "173ababah" }]
requires-python = ">=3.9"
dependencies = ["nonebot2>=2.0.0", "nonebot-adapter-onebot>=2.2.0", "httpx>=0.24"]

[project.urls]
Homepage = "https://github.com/173ababah/nonebot-plugin-fishqzone"
Repository = "https://github.com/173ababah/nonebot-plugin-fishqzone"

[tool.nonebot]
adapters = [{ name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }]
plugin_name = "nonebot-plugin-fishqzone"
plugins = ["nonebot_plugin_fishqzone"]

[tool.pdm.build]
includes = ["nonebot_plugin_fishqzone"]